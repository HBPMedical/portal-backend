[project]
name = "portal-backend-client"
version = "0.1.0"
description = "Python client library for the portal-backend API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0" }
authors = [
  { name = "Portal Backend Contributors" }
]
dependencies = [
  "requests>=2.31.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["portal_backend_client*"]
